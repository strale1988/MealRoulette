<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Roulette</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2622;--mute:#7a6f65;--acc:#e4572e;--acc2:#2f7d5b;--line:#e8dfd2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#26221e;--ink:#f3ece3;--mute:#a79b8d;--acc:#ff7a52;--acc2:#5fc79a;--line:#3a342d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
textarea,select,input[type=number]{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
textarea{resize:vertical;min-height:64px}
input[type=number]{width:90px}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btns button{flex:1;min-width:160px;border:0;border-radius:14px;font-size:16px;font-weight:700;padding:15px;cursor:pointer}
#spin{background:var(--acc);color:#fff}
#build{background:var(--acc2);color:#fff}
.note{color:var(--mute);font-size:14px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:22px}
.card h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
.desc{color:var(--mute);margin:0 0 14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.meta span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2);margin:18px 0 8px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.buy{font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:0 5px;margin-left:6px}
ol{padding-left:20px;margin:0}
ol li{margin-bottom:10px}
.row{display:flex;gap:10px;margin-top:16px}
.row button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font-size:15px;cursor:pointer}
.fav{margin-top:28px}
.fav button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>🎰 Meal Roulette</h1>
<p class="sub">Spin for a recipe or build a meal from your fridge. Metric only.</p>

<div class="chips" id="chips" role="group" aria-label="Meal type"></div>

<label for="cuisine">Cuisine (for Build from fridge, lunch and dinner)</label>
<select id="cuisine"></select>
<label for="fridge">What's in your fridge? (comma separated, optional)</label>
<textarea id="fridge" placeholder="e.g. chicken, rice, broccoli, eggs, spinach"></textarea>
<label for="people">People</label>
<input type="number" id="people" min="1" max="12" value="2">

<div class="btns">
  <button id="spin">🎰 Spin a recipe</button>
  <button id="build">🛠 Build from fridge</button>
</div>
<div class="note" id="note"></div>
<div id="out"></div>
<div class="fav" id="fav"></div>
</main>

<script src="recipes.js"></script>
<script src="engine.js"></script>
<script>
const D=window.MEAL_DATA,R=D.rules;
const TYPES=["Breakfast","Snack","Lunch","Dinner","Dessert"];
let sel="Dinner",seen=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const people=()=>Math.max(1,Math.min(12,parseInt($("people").value)||2));
const items=()=>$("fridge").value.toLowerCase().split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

function fmt(v,u){
  if(u==="pcs")return (Math.max(0.5,Math.round(v*2)/2))+" pcs";
  v=v<10?Math.round(v*2)/2:v<50?Math.round(v):Math.round(v/5)*5;
  if(u==="g"&&v>=1000)return (v/1000)+" kg";
  if(u==="ml"&&v>=1000)return (v/1000)+" l";
  return v+" "+u;
}
const stem=x=>x.replace(/s$/,"");

/* ---------- recipe roulette ---------- */
const RECIPES=D.recipes.map((r,i)=>({id:i,title:r[0],meals:r[1],min:r[2],serv:r[3],ing:r[4],steps:r[5].split("|")}));
function score(r,it){return it.filter(x=>x.length>2&&r.ing.some(g=>g[2].toLowerCase().includes(stem(x)))).length}
function spin(){
  const it=items();let pool=RECIPES.filter(r=>r.meals.includes(sel));
  let msg="";
  if(it.length){
    const best=Math.max(...pool.map(r=>score(r,it)));
    if(best>0)pool=pool.filter(r=>score(r,it)===best);
    else msg="Nothing in the fridge list matched a "+sel.toLowerCase()+" recipe, so this is a random pick. Try “Build from fridge”.";
  }
  let fresh=pool.filter(r=>!seen.includes(r.id));
  if(!fresh.length){seen=[];fresh=pool}
  const r=rnd(fresh);seen.push(r.id);
  const k=people()/r.serv;
  show({title:r.title,desc:"",min:r.min,n:people(),ing:r.ing.map(g=>({name:g[2],txt:fmt(g[0]*k,g[1]),have:it.some(x=>x.length>2&&g[2].toLowerCase().includes(stem(x)))})),steps:r.steps,flag:it.length>0},msg);
}

/* ---------- meal builder from rules ---------- */
function hit(grp,it){return Object.keys(grp).filter(k=>grp[k].re&&it.some(x=>new RegExp(grp[k].re).test(x)))}
function matchTxt(re,it){return it.find(x=>new RegExp(re).test(x))}
function build(){
  const it=items(),n=people(),meal=sel;let ing=[],steps=[],title,min=30;
  if((meal==="Lunch"||meal==="Dinner")&&window.GEN){const g=GEN.make(it,n,$("cuisine").value);show({title:g.title,desc:g.desc,min:g.min,n,ing:g.ing,steps:g.steps,flag:it.length>0},"");return}
  const add=(name,amt,u,have)=>ing.push({name,txt:fmt(amt,u),have});
  const staples=()=>R.staples.forEach(s=>add(s[3],s[1]*n,s[2],true));
  if(meal==="Breakfast"){
    min=15;
    if(it.some(x=>/oat/.test(x))){
      title="Creamy porridge";add("oats",50*n,"g",true);add("milk",250*n,"ml",it.some(x=>/milk/.test(x)));
      steps=["Simmer oats and milk with a pinch of salt over medium heat for 5 minutes, stirring.","Top with fruit or honey."];
      const f=matchTxt(R.fruit.re,it);if(f)add(f,80*n,"g",true);
    }else{
      title="Eggs on toast";const e=R.protein.egg;
      add("eggs",e.pcs*n,"pcs",it.some(x=>/egg/.test(x)));add("bread",60*n,"g",it.some(x=>/bread|toast/.test(x)));add("butter",5*n,"g",it.some(x=>/butter/.test(x)));
      const vk=hit(R.veg,it)[0];
      if(vk){add(matchTxt(R.veg[vk].re,it),R.veg[vk].g*n/2,"g",true);steps.push(cap(R.veg[vk].cook))}
      steps.push("Toast the bread until golden.",e.cook,"Pile the eggs on the toast and serve.");
    }
  }else if(meal==="Dessert"){
    min=35;const f=matchTxt(R.fruit.re,it)||"apples";title="Baked "+f;
    add(f,200*n,"g",it.includes(f));add("cinnamon",3*n,"g",false);add("honey",10*n,"g",false);
    steps=["Heat the oven to 180 °C.","Slice the fruit into a dish and toss with cinnamon and honey.","Bake 20–25 minutes until soft and caramelised."];
  }else if(meal==="Snack"){
    min=10;const vk=hit(R.veg,it)[0],f=matchTxt(R.fruit.re,it),base=f||(vk&&matchTxt(R.veg[vk].re,it))||"carrot";
    title=cap(base)+" with yogurt dip";add(base,150*n,"g",!!(f||vk));add("yogurt",100*n,"g",it.some(x=>/yogh?urt/.test(x)));add("salt",1,"g",true);
    steps=["Cut "+base+" into sticks or slices.","Season the yogurt with a pinch of salt and a squeeze of lemon, then dip."];
  }else{
    const pk=hit(R.protein,it)[0]||rnd(["chicken","beef","salmon","tofu","chickpea"]);
    const ck=hit(R.carb,it)[0]||rnd(Object.keys(R.carb));
    let vks=hit(R.veg,it).slice(0,2);if(!vks.length)vks=[rnd(["tomato","broccoli","pepper","zucchini","carrot"])];
    const P=R.protein[pk],C=R.carb[ck],haveV=hit(R.veg,it).length>0;
    add(P.name,(P.g||P.pcs)*n,P.g?"g":"pcs",hit(R.protein,it).includes(pk));
    add(C.name,C.g*n,"g",hit(R.carb,it).includes(ck));
    vks.forEach(k=>add(matchTxt(R.veg[k].re,it)||k,R.veg[k].g*n/vks.length,"g",haveV));
    staples();
    const w=Math.round(C.g*n*(C.water||0)/5)*5;
    steps.push(C.cook.replace("{w}",w));
    vks.forEach(k=>steps.push(cap(matchTxt(R.veg[k].re,it)||k)+": "+R.veg[k].cook));
    steps.push(P.cook,"Combine everything, season with salt, black pepper and a squeeze of lemon if you have it, and serve.");
    title=cap(pk==="chickpea"?"chickpeas":pk)+", "+ck+" & "+vks.join(" & ");
  }
  show({title,desc:"Built from cooking rules, not a fixed recipe. Quantities are per "+n+" "+(n>1?"people":"person")+".",min,n,ing,steps,flag:it.length>0},"");
}

/* ---------- rendering ---------- */
let current=null;
function show(r,msg){
  current=r;$("note").textContent=msg;
  $("out").innerHTML=`<article class="card"><h2>${esc(r.title)}</h2>${r.desc?`<p class="desc">${esc(r.desc)}</p>`:""}
  <div class="meta"><span>⏱ ${r.min} min</span><span>🍽 ${r.n} ${r.n>1?"people":"person"}</span><span>${sel}</span></div>
  <h3>Ingredients</h3><ul class="ing">${r.ing.map(i=>`<li><span>${esc(i.name)}${r.flag&&!i.have?'<span class="buy">to buy</span>':""}</span><span class="q">${esc(i.txt)}</span></li>`).join("")}</ul>
  <h3>Method</h3><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
  <div class="row"><button id="save">♥ Save</button><button id="again">Again</button></div></article>`;
  $("save").onclick=()=>{const f=store("favs")||[];if(!f.some(x=>x.title===r.title)){f.unshift(r);store("favs",f.slice(0,30))}favs()};
  $("again").onclick=()=>current&&current.desc?build():spin();
}
function favs(){
  const f=store("favs")||[];
  $("fav").innerHTML=f.length?"<h3>Saved</h3>"+f.map((r,i)=>`<button data-i="${i}">${esc(r.title)}</button>`).join(""):"";
  $("fav").querySelectorAll("button").forEach(b=>b.onclick=()=>{show(f[+b.dataset.i],"");scrollTo({top:0,behavior:"smooth"})});
}
function chips(){
  $("chips").innerHTML=TYPES.map(t=>`<button class="chip" aria-pressed="${t===sel}" data-t="${t}">${t}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=b.dataset.t;seen=[];chips()});
}
$("spin").onclick=spin;$("build").onclick=build;if(window.GEN)$("cuisine").innerHTML='<option value="">Surprise me</option>'+Object.keys(GEN.cuisines).map(c=>`<option>${c}</option>`).join("");
chips();favs();
</script>
</body>
</html>
